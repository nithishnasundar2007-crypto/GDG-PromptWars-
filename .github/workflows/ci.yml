name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run validate-seeds
      - run: npm run build
      - name: Check GEMINI_API_KEY never reaches the web bundle
        run: node scripts/check-bundle-key.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
